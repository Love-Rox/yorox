<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オフライン - Yorox</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f4efde; color: #1b2240;
    font-family: system-ui, sans-serif; text-align: center; padding: 2rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #12162b; color: #efe9d6; }
  }
  .num { font-size: 5rem; font-weight: 900; position: relative; line-height: 1; }
  .num .shadow { position: absolute; inset: 0; transform: translate(-3px, -3px); color: #f0357f; }
  h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
  p { font-size: 0.9rem; opacity: 0.75; max-width: 26rem; margin: 0 auto; }
  button {
    margin-top: 1.5rem; padding: 0.6rem 1.4rem; font-weight: 700; cursor: pointer;
    background: transparent; color: inherit; border: 2px solid currentColor;
  }
</style>
</head>
<body>
<div>
  <div class="num" aria-hidden="true"><span class="shadow">⌁</span><span>⌁</span></div>
  <h1>オフラインです</h1>
  <p>ネットワークに接続できません。接続が戻ったら再読み込みしてください。イベントの申込・キャンセルはオンライン時のみ反映されます。</p>
  <button onclick="location.reload()">再読み込み</button>
</div>
</body>
</html>
