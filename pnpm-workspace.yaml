packages:
  - packages/*
allowBuilds:
  esbuild: true
  workerd: true
# 脆弱性対応で間接依存だけを上げる。上の部品(miniflare)が版を固定していて
# 上の部品を上げても直らないものに限る。miniflare が直った版に追従したら外す。
overrides:
  # miniflare@4.20260730.0 が undici@7.28.0 を固定(7.30.1 未満に既知の脆弱性。同じ 7 系で直る)
  undici@7: ^7.30.1
  # miniflare@4.20260730.0 が sharp@0.35.2 を固定(0.35.5 未満に既知の脆弱性。同じ 0.35 系で直る)
  sharp@0.35: ^0.35.5
auditConfig:
  ignoreGhsas:
    # esbuild の開発サーバー(serve)の脆弱性。drizzle-kit 0.31 → @esbuild-kit/core-utils が
    # esbuild 0.18 を使っているが、core-utils は transform / transformSync だけを呼び serve は使わない。
    # 使うのも手元の db:generate のときだけ。drizzle-kit 1.0 正式版(esbuild 0.25 を直接使う)に上げたら外す。
    - GHSA-67mh-4wv8-2f99
