# Yorox 自己ホスト用 docker compose
# 起動: docker compose up -d → http://localhost:8080
services:
  yorox:
    build: .
    ports:
      - '8080:8080'
    volumes:
      - yorox-data:/data
    environment:
      # 公開 URL(本番では必須。メール内のログインリンク・OAuth コールバック・
      # CSRF の Origin 検証に使う)。リバースプロキシ(Caddy / nginx / Cloudflare Tunnel)
      # の背後で未設定だと、ログインやフォーム送信ができません。
      # X-Forwarded-* ヘッダは既定では信用しません(偽装によるリンク乗っ取り対策)。
      # PUBLIC_ORIGIN: 'https://events.example.com'
      # PUBLIC_ORIGIN を使えない場合のみ: クライアントの X-Forwarded-* を必ず上書きする
      # プロキシの背後で '1' にすると、それらのヘッダから公開 URL を組み立てる
      # TRUST_PROXY: '1'
      # ファイルアップロード(アバター・サムネイル)を有効化
      FILE_UPLOADS: '1'
      MAX_UPLOAD_MB: '5'
      # メール送信(SMTP)。未設定の間はログイン用リンクがコンテナログに出る
      # MAIL_TRANSPORT: smtp
      # MAIL_FROM: 'Yorox <noreply@example.com>'
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: '587'
      # SMTP_USERNAME: user
      # SMTP_PASSWORD: pass
      # 送信レート上限(任意)
      # MAIL_RATE_PER_MINUTE: '10'
      # MAIL_RATE_PER_HOUR: '100'
      # OAuth ログイン(任意)
      # GITHUB_CLIENT_ID: ...
      # GITHUB_CLIENT_SECRET: ...
      # GOOGLE_CLIENT_ID: ...
      # GOOGLE_CLIENT_SECRET: ...
      # DISCORD_CLIENT_ID: ...
      # DISCORD_CLIENT_SECRET: ...
      # Stripe 決済(グループ口座での事前決済)。プラットフォームアカウントが必要
      # STRIPE_SECRET_KEY: sk_live_...
      # STRIPE_CONNECT_CLIENT_ID: ca_...
      # STRIPE_WEBHOOK_SECRET: whsec_...
volumes:
  yorox-data:
